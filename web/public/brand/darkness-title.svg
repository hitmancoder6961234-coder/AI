<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0" stop-color="#17132e"/>
      <stop offset="0.6" stop-color="#0a0915"/>
      <stop offset="1" stop-color="#040409"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8fb4ff"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#c8d8ff"/>
      <stop offset="1" stop-color="#7c6cf0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <ellipse cx="800" cy="190" rx="520" ry="90" fill="#7c6cf0" opacity="0.22" filter="url(#blur)"/>

  <!-- glow copy of the title -->
  <text x="800" y="238" text-anchor="middle" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif"
        font-size="190" font-weight="800" letter-spacing="30" fill="url(#glow)" opacity="0.7" filter="url(#blur)">DARKNESS</text>
  <!-- crisp title -->
  <text x="800" y="238" text-anchor="middle" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif"
        font-size="190" font-weight="800" letter-spacing="30" fill="url(#glow)">DARKNESS</text>

  <!-- light line with orb -->
  <rect x="250" y="291" width="1100" height="3" fill="url(#line)"/>
  <circle cx="800" cy="292" r="26" fill="url(#orb)" filter="url(#soft)"/>
  <circle cx="800" cy="292" r="6" fill="#ffffff"/>

  <text x="800" y="352" text-anchor="middle" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif"
        font-size="30" font-weight="400" letter-spacing="14" fill="#9aa4d6" opacity="0.85">LIGHT FROM THE DARK</text>
</svg>
