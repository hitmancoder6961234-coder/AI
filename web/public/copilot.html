<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#08080f" />
  <title>Darkness Copilot</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/atmosphere/atmosphere.css" />
  <link rel="stylesheet" href="/copilot-page.css" />
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Conversations">
    <div class="side-h"><div class="brand"><img src="/brand/darkness-logo.svg" alt=""><span>Copilot</span></div></div>
    <button class="new" id="newChat" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> New chat</button>
    <div class="list" id="list" role="list"></div>
    <div class="side-f"><a href="/" target="_top">Darkness AI</a><a href="/#/builder" target="_top">Project Studio</a><button type="button" id="clearAll">Clear all</button></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="top">
      <button class="iconbtn menu-btn" id="menu" type="button" aria-label="Conversations"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="title" id="title">New chat</div>
      <span class="badge" id="model" title="Model used for answers">...</span>
    </header>
    <div class="scroll" id="scroll"><div class="col" id="col"></div></div>
    <button class="jump" id="jump" type="button" aria-label="Scroll to latest"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
    <div class="dock">
      <div class="tools">
        <label class="pill" id="focusPill" title="Limit what the Copilot answers"><span>Focus</span><select id="focus" aria-label="Focus"><option value="open">Anything</option><option value="topic">One topic</option><option value="project">My project</option></select></label>
        <label class="pill field" id="topicPill" hidden><input id="topic" maxlength="200" placeholder="Topic, e.g. Python programming" aria-label="Focus topic"></label>
        <label class="pill" id="projPill" hidden><span>Project</span><select id="proj" aria-label="Project"><option value="">Choose...</option></select></label>
        <label class="pill" id="modelPill" hidden title="Which model answers"><span>Model</span><select id="choice" aria-label="Model"><option value="auto">Auto</option><option value="gpt">GPT (OpenAI)</option><option value="mine">My model</option></select></label>
        <label class="pill" id="webPill"><input type="checkbox" id="web"> Search the web</label>
      </div>
      <div class="focus-note" id="focusNote" hidden></div>
      <form class="composer" id="form" autocomplete="off">
        <textarea id="input" rows="1" maxlength="20000" placeholder="Message Darkness Copilot" aria-label="Message"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </form>
      <div class="foot">Copilot can make mistakes. Check important information.</div>
    </div>
  </main>
</div>

<script src="/copilot-page.js"></script>
<script src="/atmosphere/atmosphere.js" defer></script>
</body>
</html>
