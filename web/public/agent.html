<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#08080f" />
  <title>Darkness Agent</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/atmosphere/atmosphere.css" />
  <style>
    :root {
      --bg: #08080f; --panel: rgba(16, 16, 28, .66); --line: rgba(255,255,255,.14); --ink: #eef0ff; --muted: #9aa4d6;
      --accent: #7c8cff; --ok: #4ade80; --bad: #fb7185; --radius: 16px;
    }
    html[data-atmosphere="blood"] { --panel: rgba(30,6,12,.66); --line: rgba(255,90,90,.2); --muted: #d9a7a9; --accent: #fb7185; }
    html[data-atmosphere="water"] { --panel: rgba(4,22,48,.62); --line: rgba(120,200,255,.2); --muted: #96bfe0; --accent: #38bdf8; }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; min-height: 100vh; color: var(--ink); font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; background: transparent; }
    main { max-width: 860px; margin: 0 auto; padding: 28px 16px 120px; }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
    header img { width: 44px; height: 44px; border-radius: 12px; }
    header h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
    header p { margin: 0; color: var(--muted); font-size: 13px; }
    header a { margin-left: auto; color: var(--accent); text-decoration: none; font-size: 13px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
    textarea { width: 100%; min-height: 96px; resize: vertical; background: transparent; color: var(--ink); border: 0; outline: 0; font: inherit; }
    .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 8px; }
    .bar small { color: var(--muted); }
    button.run { margin-left: auto; background: var(--accent); color: #07101f; border: 0; border-radius: 12px; padding: 10px 20px; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer; }
    button.run:disabled { opacity: .55; cursor: progress; }
    button.stop { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; cursor: pointer; font: inherit; }
    button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #log { margin-top: 20px; display: grid; gap: 10px; }
    .step { border-left: 3px solid var(--line); padding: 8px 12px; background: var(--panel); border-radius: 0 12px 12px 0; font-size: 13.5px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    .step.thought { border-color: var(--accent); color: var(--muted); font-style: italic; }
    .step.tool { border-color: #fbbf24; }
    .step.ok { border-color: var(--ok); }
    .step.bad { border-color: var(--bad); }
    .step b { font-weight: 600; }
    .step pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; font: 12.5px/1.5 ui-monospace, Consolas, monospace; color: var(--muted); max-height: 180px; overflow: auto; }
    #answer { margin-top: 18px; display: none; }
    #answer h2 { margin: 0 0 8px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    #answer .body { white-space: pre-wrap; word-break: break-word; }
    #answer code { background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 6px; font: 13px ui-monospace, Consolas, monospace; }
    #status { color: var(--muted); font-size: 13px; margin-top: 10px; min-height: 1.4em; }
    .notice { margin-top: 14px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--bad); color: #ffd7dd; background: rgba(251,113,133,.12); display: none; }
    .notice a { color: #fff; }
    .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .tools label { display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
    .tools input { accent-color: var(--accent); }
  </style>
</head>
<body>
<main>
  <header>
    <img src="/brand/darkness-logo.svg" alt="" />
    <div><h1>Darkness Agent</h1><p>Reasons step by step and uses tools. Your goal is never logged.</p></div>
    <a href="/">← Back to chat</a>
  </header>

  <section class="card">
    <label for="goal" class="sr" style="position:absolute;left:-9999px">Goal</label>
    <textarea id="goal" maxlength="8000" placeholder="Give the agent a goal… e.g. &quot;What is (1273 * 48) / 7, and what day of the week is it in Asia/Kolkata right now?&quot;"></textarea>
    <div class="tools" id="tools" aria-label="Tools the agent may use"></div>
    <div class="bar">
      <small id="provider"></small>
      <button class="stop" id="stop" type="button" hidden>Stop</button>
      <button class="run" id="run" type="button">Run agent</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <div class="notice" id="auth">You need to sign in first. <a href="/">Open Darkness AI</a>, sign in, then come back.</div>
  </section>

  <div id="log" aria-live="polite"></div>
  <section class="card" id="answer"><h2>Answer</h2><div class="body" id="answerBody"></div></section>
</main>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var controller = null;

  function token() { try { return localStorage.getItem('darkness_token'); } catch (e) { return null; } }
  function headers() {
    var h = { 'Content-Type': 'application/json' };
    var t = token(); if (t) h.Authorization = 'Bearer ' + t;
    return h;
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  // Minimal, injection-safe Markdown: everything is escaped first, then a few inline patterns are re-introduced.
  function md(s) {
    return esc(s).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  }
  function add(cls, html) {
    var d = document.createElement('div'); d.className = 'step ' + cls; d.innerHTML = html; $('log').appendChild(d);
    d.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  function status(t) { $('status').textContent = t || ''; }

  function loadTools() {
    fetch('/api/agent/tools', { headers: headers(), credentials: 'include' }).then(function (r) {
      if (r.status === 401) { $('auth').style.display = 'block'; return null; }
      return r.json();
    }).then(function (j) {
      if (!j) return;
      $('provider').textContent = j.active ? 'Model provider: ' + j.active : 'No AI provider key configured on the server';
      $('tools').innerHTML = '';
      j.tools.forEach(function (t) {
        var l = document.createElement('label'); l.title = t.description;
        var i = document.createElement('input'); i.type = 'checkbox'; i.checked = true; i.value = t.name;
        l.appendChild(i); l.appendChild(document.createTextNode(t.name)); $('tools').appendChild(l);
      });
    }).catch(function () { status('Could not reach the server.'); });
  }

  function handle(type, data) {
    if (type === 'start') status('Thinking with ' + data.provider + ' / ' + data.model + '…');
    else if (type === 'thought') add('thought', esc(data.text));
    else if (type === 'tool_call') add('tool', '<b>' + esc(data.tool) + '</b> <span style="color:var(--muted)">' + esc(JSON.stringify(data.args)) + '</span>');
    else if (type === 'tool_result') add(data.ok ? 'ok' : 'bad', '<b>' + esc(data.tool) + (data.ok ? ' ✓' : ' ✗') + '</b><pre>' + esc(data.output) + '</pre>');
    else if (type === 'final') { $('answer').style.display = 'block'; $('answerBody').innerHTML = md(data.answer); status('Done in ' + data.steps + ' step' + (data.steps === 1 ? '' : 's') + '.'); }
    else if (type === 'error') { add('bad', '<b>Error</b> ' + esc(data.message)); status(''); }
  }

  async function run() {
    var goal = $('goal').value.trim();
    if (!goal) { status('Write a goal first.'); return; }
    $('log').innerHTML = ''; $('answer').style.display = 'none'; $('auth').style.display = 'none';
    var tools = [].slice.call(document.querySelectorAll('#tools input:checked')).map(function (i) { return i.value; });
    controller = new AbortController();
    $('run').disabled = true; $('stop').hidden = false; status('Starting…');
    try {
      var res = await fetch('/api/agent/run', { method: 'POST', headers: headers(), credentials: 'include', signal: controller.signal, body: JSON.stringify({ goal: goal, tools: tools }) });
      if (res.status === 401) { $('auth').style.display = 'block'; status(''); return; }
      if (!res.ok) { var j = await res.json().catch(function () { return {}; }); add('bad', '<b>Error</b> ' + esc(j.error || res.statusText)); status(''); return; }
      var reader = res.body.getReader(), dec = new TextDecoder(), buf = '';
      for (;;) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += dec.decode(chunk.value, { stream: true });
        var parts = buf.split('\n\n'); buf = parts.pop();
        parts.forEach(function (p) {
          var ev = /^event: (.+)$/m.exec(p), da = /^data: (.+)$/m.exec(p);
          if (ev && da) { try { handle(ev[1], JSON.parse(da[1])); } catch (e) { /* ignore a malformed frame */ } }
        });
      }
    } catch (e) {
      if (e.name !== 'AbortError') add('bad', '<b>Error</b> ' + esc(e.message)); else status('Stopped.');
    } finally { $('run').disabled = false; $('stop').hidden = true; controller = null; }
  }

  $('run').addEventListener('click', run);
  $('stop').addEventListener('click', function () { if (controller) controller.abort(); });
  $('goal').addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') run(); });
  loadTools();
})();
</script>
<script src="/atmosphere/atmosphere.js" defer></script>
</body>
</html>
