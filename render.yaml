# Render Blueprint — Darkness AI backend (API + built web UI).
#
# This replaces the older "darkness-ai-backend" blueprint (kept in legacy/render.original.yaml).
#   Render dashboard → New → Blueprint → pick the repo (blueprint file: render.yaml)
#
# Secrets (sync: false) are entered once in the dashboard and never stored in git.

services:
  - type: web
    name: darkness-ai
    runtime: node
    region: singapore            # pick the region closest to your users
    plan: starter                # a persistent disk needs a paid plan; see "free tier" note in DEPLOY.md
    buildCommand: PUPPETEER_SKIP_DOWNLOAD=true npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/ready   # readiness: database, storage and upload temp folder are usable (use /api/health for plain liveness)
    autoDeploy: true
    disk:
      name: darkness-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: PRIVACY_STRICT
        value: "true"
      - key: PRIVACY_CSP
        value: enforce              # report-only = same policy, nothing blocked (to try a change); see SECURITY.md
      - key: DARKNESS_STORAGE_ROOT
        value: /var/data
      - key: TRUST_PROXY_HOPS
        value: "2"                  # Render's proxy + Vercel's proxy. Use 1 if users hit Render directly.
      - key: CORS_ORIGINS
        sync: false                 # e.g. https://your-app.vercel.app (leave empty when the UI is served by this service)
      - key: PRIVACY_ENCRYPTION_KEY
        sync: false                 # generate with scripts/new-secrets.ps1
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: COPILOT_MODEL
        value: gpt-4o-mini           # model the Copilot uses when OPENAI_API_KEY is set
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AGENT_PROVIDER
        sync: false                 # optional: gemini | anthropic | openai | openrouter | groq | together | mistral
      - key: AIVEN_PG_URI
        sync: false                 # from the Aiven console (Service URI)
      - key: AIVEN_CA_CERT
        sync: false                 # Aiven project CA certificate (PEM text)
      # Optional, added by hand in the dashboard (Environment) once you have a mail account; they are NOT listed here on purpose, because a
      # `sync: false` entry makes Render ask for a value every time the blueprint is created. Unset = "Forgot password?" says it is unavailable.
      #   MAIL_PROVIDER (smtp | resend), MAIL_FROM, PUBLIC_APP_URL (the address USERS open: your Vercel domain when you use the front door),
      #   SMTP_HOST / SMTP_PORT / SMTP_TLS / SMTP_USER / SMTP_PASS   or   RESEND_API_KEY
      # Test with a real mailbox first: docs/OPERATIONS-VERIFICATION.md section 3.2. All variables: docs/ENVIRONMENT-VARIABLES.md.
