<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#1b1633"/>
      <stop offset="0.55" stop-color="#0b0a16"/>
      <stop offset="1" stop-color="#040409"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#bff7ee"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="round"><rect width="1024" height="1024" rx="230"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- ambient halo -->
    <circle cx="512" cy="450" r="300" fill="#7c6cf0" opacity="0.22" filter="url(#blur)"/>

    <!-- D monogram: glow layer -->
    <path d="M330 270 H520 C660 270 740 350 740 470 C740 590 660 670 520 670 H330 Z"
          fill="none" stroke="url(#glow)" stroke-width="64" stroke-linejoin="round" opacity="0.65" filter="url(#blur)"/>
    <!-- D monogram: crisp layer -->
    <path d="M330 270 H520 C660 270 740 350 740 470 C740 590 660 670 520 670 H330 Z"
          fill="none" stroke="url(#glow)" stroke-width="46" stroke-linejoin="round"/>
    <!-- inner shadow: darkness swallowing the counter -->
    <path d="M390 330 H515 C620 330 680 385 680 470 C680 555 620 610 515 610 H390 Z" fill="#05050c"/>
    <!-- light spark inside the dark -->
    <circle cx="540" cy="470" r="70" fill="url(#orb)" filter="url(#soft)"/>
    <circle cx="540" cy="470" r="16" fill="#ffffff"/>

    <!-- wordmark -->
    <text x="512" y="838" text-anchor="middle" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif"
          font-size="96" font-weight="700" letter-spacing="26" fill="url(#glow)">DARKNESS</text>
    <rect x="352" y="876" width="320" height="4" rx="2" fill="url(#glow)" opacity="0.55"/>
  </g>
  <rect x="3" y="3" width="1018" height="1018" rx="227" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="3"/>
</svg>
